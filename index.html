<title>Семь направлений автоматизации</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Serif:wght@600;700&display=swap">

<style>
:root{
  --white:#FFFFFF;
  --soft:#F4F7F7;
  --soft2:#EAF0F0;
  --ink:#0C1416;
  --ink2:#54666A;
  --ink3:#8B9BA0;
  --rule:#E1E8E9;
  --rule2:#C6D2D3;
  --ac:#0E5461;
  --ac2:#13899B;
  --ac3:#B9DDE2;
  --acsoft:#E7F2F4;
  --am:#B5821B;
  --amsoft:#FAF2E0;
  --cl:#AB5236;
  --clsoft:#FBEDE8;
  --sans:"Golos Text","Helvetica Neue",Arial,sans-serif;
  --serif:"IBM Plex Serif",Georgia,serif;
  --mono:"IBM Plex Mono",Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%; margin:0; overflow:hidden; background:var(--white)}
body{font-family:var(--sans); color:var(--ink); -webkit-font-smoothing:antialiased}
#root{height:100%}

/* ---------- каркас ---------- */
.stage{position:fixed; inset:0; display:flex; flex-direction:column; background:var(--white)}
.slide{flex:1; min-height:0; display:flex; flex-direction:column; padding:4.2vh clamp(24px,4.4vw,74px) 2vh; position:relative}
.s-head{flex:none}
.s-body{flex:1; min-height:0; display:flex; align-items:center; justify-content:center; padding:2.2vh 0}
.s-foot{flex:none; min-height:2.4vh}

.eyebrow{
  font-family:var(--mono); font-size:clamp(9.5px,1.25vh,12.5px); letter-spacing:.17em;
  text-transform:uppercase; color:var(--ink3); display:flex; gap:14px; align-items:baseline;
  margin-bottom:1.4vh;
}
.eyebrow b{color:var(--ac); font-weight:600}
.eyebrow .sp{margin-left:auto}
h1{font-family:var(--serif); font-weight:700; font-size:clamp(34px,8.4vh,86px); line-height:.98; letter-spacing:-.025em; margin:0; text-wrap:balance}
h2{font-family:var(--serif); font-weight:600; font-size:clamp(24px,5vh,54px); line-height:1.02; letter-spacing:-.02em; margin:0; text-wrap:balance}
.sub{font-size:clamp(13px,2.05vh,20px); line-height:1.42; color:var(--ink2); margin:1.1vh 0 0; max-width:70ch}
.sub b{color:var(--ink); font-weight:600}
.src{font-family:var(--mono); font-size:clamp(8.5px,1.15vh,11px); color:var(--ink3); letter-spacing:.02em}

/* ---------- анимации ---------- */
@keyframes rv{from{opacity:0; transform:translateY(16px)} to{opacity:1; transform:none}}
@keyframes rvx{from{opacity:0; transform:translateX(26px)} to{opacity:1; transform:none}}
@keyframes grow{from{transform:scaleX(0)} to{transform:scaleX(1)}}
@keyframes growy{from{transform:scaleY(0)} to{transform:scaleY(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{from{opacity:0; transform:scale(.86)} to{opacity:1; transform:none}}
.rv{opacity:0; animation:rv .55s cubic-bezier(.2,.75,.3,1) forwards; animation-delay:var(--d,0ms)}
.rvx{opacity:0; animation:rvx .55s cubic-bezier(.2,.75,.3,1) forwards; animation-delay:var(--d,0ms)}
.pop{opacity:0; animation:pop .5s cubic-bezier(.2,.9,.3,1) forwards; animation-delay:var(--d,0ms)}
.gx{transform:scaleX(0); transform-origin:left; animation:grow .85s cubic-bezier(.25,.8,.3,1) forwards; animation-delay:var(--d,0ms)}
.gy{transform:scaleY(0); transform-origin:bottom; animation:growy .8s cubic-bezier(.25,.8,.3,1) forwards; animation-delay:var(--d,0ms)}
.dw{stroke-dasharray:900; stroke-dashoffset:900; animation:draw 1s ease forwards; animation-delay:var(--d,0ms)}
@media (prefers-reduced-motion:reduce){
  .rv,.rvx,.pop{opacity:1; animation:none; transform:none}
  .gx,.gy{transform:none; animation:none}
  .dw{stroke-dashoffset:0; animation:none}
}

/* ---------- низ ---------- */
.bar{
  flex:none; height:52px; border-top:1px solid var(--rule); background:var(--white);
  display:flex; align-items:center; gap:16px; padding:0 clamp(18px,3vw,40px);
}
.ticks{display:flex; gap:4px; flex:1; align-items:center}
.tick{
  height:22px; flex:1; max-width:46px; border:0; background:none; cursor:pointer; padding:0;
  display:flex; align-items:center;
}
.tick i{display:block; width:100%; height:2px; background:var(--rule2); transition:background .22s, height .22s}
.tick:hover i{background:var(--ac2)}
.tick[data-on="1"] i{background:var(--ac); height:4px}
.count{font-family:var(--mono); font-size:12px; color:var(--ink2); font-variant-numeric:tabular-nums; letter-spacing:.04em}
.count b{color:var(--ac); font-weight:600}
.btns{display:flex; gap:6px}
.btns button{
  width:32px; height:32px; border:1px solid var(--rule2); background:var(--white); color:var(--ink2);
  border-radius:2px; cursor:pointer; font-family:var(--mono); font-size:13px; line-height:1;
  display:flex; align-items:center; justify-content:center;
}
.btns button:hover:not(:disabled){border-color:var(--ac); color:var(--ac)}
.btns button:disabled{opacity:.3; cursor:default}
.brand{font-family:var(--mono); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink3); white-space:nowrap}
:focus-visible{outline:2px solid var(--ac); outline-offset:2px}

/* ---------- общие элементы ---------- */
.chip{
  display:inline-flex; align-items:center; font-family:var(--mono);
  font-size:clamp(8px,1.1vh,10px); letter-spacing:.12em; text-transform:uppercase;
  border:1px solid; border-radius:2px; padding:3px 7px; white-space:nowrap;
}
.chip[data-t="v"]{color:var(--ac); border-color:var(--ac); background:var(--acsoft)}
.chip[data-t="w"]{color:var(--am); border-color:var(--am); background:var(--amsoft)}
.chip[data-t="m"]{color:var(--ink3); border-color:var(--rule2); background:var(--soft)}
.chip[data-t="f"]{color:var(--cl); border-color:var(--cl); background:var(--clsoft)}

.big{display:flex; flex-direction:column; gap:.6vh}
.big .n{
  font-family:var(--serif); font-weight:700; font-size:clamp(38px,10.5vh,110px);
  line-height:.86; letter-spacing:-.035em; color:var(--ac); font-variant-numeric:tabular-nums;
}
.big .n small{font-size:.42em; letter-spacing:-.01em; margin-left:.12em}
.big .cap{font-size:clamp(11.5px,1.72vh,16px); line-height:1.35; color:var(--ink2); max-width:26ch}
.big .cap b{color:var(--ink); font-weight:600}

.hatch{background-image:repeating-linear-gradient(-45deg,transparent 0 6px,rgba(12,20,22,.09) 6px 7px)}

.lbl{font-family:var(--mono); font-size:clamp(8.5px,1.2vh,11px); letter-spacing:.14em; text-transform:uppercase; color:var(--ink3)}
.lbl.ac{color:var(--ac)}

svg.viz{width:100%; height:100%; max-height:100%; display:block}
svg text{font-family:var(--sans)}
.t-lbl{font-family:var(--sans); fill:var(--ink); font-size:14px}
.t-sub{font-family:var(--sans); fill:var(--ink2); font-size:12px}
.t-mono{font-family:var(--mono); fill:var(--ink3); font-size:11px; letter-spacing:.08em}
.t-code{font-family:var(--mono); fill:var(--ac); font-size:13px; font-weight:600}
.t-num{font-family:var(--mono); fill:var(--ink); font-size:12px; font-variant-numeric:tabular-nums}

/* ---------- титул ---------- */
.hero{display:grid; grid-template-columns:1.15fr .85fr; gap:clamp(24px,4vw,64px); align-items:center; width:100%; height:100%}
.hero-stats{display:flex; gap:clamp(16px,2.6vw,40px); margin-top:3vh; padding-top:1.8vh; border-top:2px solid var(--ink)}
.hero-stats div{display:flex; flex-direction:column; gap:2px}
.hero-stats em{font-style:normal; font-family:var(--serif); font-weight:700; font-size:clamp(20px,3.6vh,36px); color:var(--ac); line-height:1}
.hero-stats span{font-family:var(--mono); font-size:clamp(8.5px,1.15vh,11px); letter-spacing:.11em; text-transform:uppercase; color:var(--ink3)}
.board{border:1px solid var(--rule); background:var(--white); box-shadow:0 20px 50px -34px rgba(12,20,22,.5)}
.board-h{font-family:var(--mono); font-size:clamp(8.5px,1.15vh,10.5px); letter-spacing:.16em; text-transform:uppercase; color:var(--ink3); padding:1.3vh 14px; border-bottom:1px solid var(--rule); display:flex; justify-content:space-between}
.board-s{padding:1.3vh 12px}
.board-s+.board-s{border-top:1px solid var(--rule)}
.board-l{font-family:var(--mono); font-size:clamp(8px,1.1vh,10px); letter-spacing:.14em; text-transform:uppercase; color:var(--ac); margin-bottom:.9vh}
.cellrow{display:grid; gap:5px}
.cell{
  display:flex; align-items:center; gap:10px; text-align:left; width:100%;
  border:1px solid var(--rule); background:var(--soft); padding:.95vh 10px; cursor:pointer; border-radius:2px;
  font-family:var(--sans); font-size:clamp(11px,1.55vh,14px); color:var(--ink2); line-height:1.2;
  transition:border-color .16s, background .16s, color .16s, transform .16s;
}
.cell code{font-family:var(--mono); font-size:clamp(10px,1.4vh,12.5px); font-weight:600; color:var(--ac); flex:none}
.cell:hover{border-color:var(--ac); background:var(--acsoft); color:var(--ink); transform:translateX(3px)}

/* ---------- плитки направлений ---------- */
.tiles{display:grid; gap:clamp(10px,1.4vw,18px); width:100%; height:100%}
.tile{
  border:1px solid var(--rule); background:var(--white); border-radius:2px; cursor:pointer;
  padding:clamp(14px,2.4vh,26px); display:flex; flex-direction:column; gap:1.2vh; text-align:left;
  transition:border-color .18s, box-shadow .18s, transform .18s; min-height:0;
}
.tile:hover{border-color:var(--ac); box-shadow:0 16px 34px -26px rgba(12,20,22,.55); transform:translateY(-3px)}
.tile .ico{flex:none; height:clamp(38px,7vh,64px)}
.tile .ico svg{height:100%; width:auto; display:block}
.tile .code{font-family:var(--mono); font-size:clamp(11px,1.5vh,13px); font-weight:600; color:var(--ac); letter-spacing:.06em}
.tile h3{font-family:var(--serif); font-weight:600; font-size:clamp(15px,2.5vh,25px); line-height:1.12; margin:0; letter-spacing:-.012em}
.tile p{margin:0; font-size:clamp(11px,1.6vh,14px); line-height:1.42; color:var(--ink2); flex:1; min-height:0}
.tile .ft{display:flex; align-items:center; gap:8px; flex-wrap:wrap}

/* ---------- сплит-компоновка ---------- */
.split{display:grid; grid-template-columns:1fr auto; gap:clamp(20px,3.4vw,56px); width:100%; height:100%; align-items:center}
.split.rev{grid-template-columns:auto 1fr}
.vizbox{min-width:0; min-height:0; height:100%; display:flex; align-items:center}
.side{display:flex; flex-direction:column; gap:2vh; width:clamp(180px,20vw,300px)}

/* ---------- шкала доказательности ---------- */
.tiers{display:grid; grid-template-columns:repeat(3,1fr); gap:clamp(12px,1.8vw,24px); width:100%}
.tier{border:1px solid var(--rule); border-radius:2px; background:var(--white); overflow:hidden; display:flex; flex-direction:column}
.tier .segs{display:flex; gap:3px; padding:12px 14px 0}
.tier .segs i{flex:1; height:7px; background:var(--soft2); border-radius:1px}
.tier[data-t="v"] .segs i:nth-child(-n+3){background:var(--ac)}
.tier[data-t="w"] .segs i:nth-child(-n+2){background:var(--am)}
.tier[data-t="m"] .segs i:nth-child(-n+1){background:var(--rule2)}
.tier .in{padding:1.6vh 14px 1.8vh}
.tier .nm{font-family:var(--mono); font-size:clamp(9.5px,1.35vh,12px); letter-spacing:.14em; text-transform:uppercase; margin-bottom:.9vh}
.tier[data-t="v"] .nm{color:var(--ac)} .tier[data-t="w"] .nm{color:var(--am)} .tier[data-t="m"] .nm{color:var(--ink3)}
.tier p{margin:0; font-size:clamp(11.5px,1.62vh,15px); line-height:1.42; color:var(--ink2)}
.tier .ex{margin-top:1.4vh; padding-top:1.2vh; border-top:1px solid var(--rule); font-family:var(--mono); font-size:clamp(9px,1.28vh,11.5px); line-height:1.5; color:var(--ink3)}
.tier .ex b{color:var(--ink2); font-weight:500}

/* ---------- финал ---------- */
.fin{display:grid; grid-template-columns:1fr 1fr; gap:clamp(22px,3.6vw,60px); width:100%; align-items:center}
.asks{display:flex; flex-direction:column; gap:1.6vh}
.ask{display:grid; grid-template-columns:34px 1fr; gap:16px; align-items:baseline; border-bottom:1px solid var(--rule); padding-bottom:1.5vh}
.ask:last-child{border-bottom:0}
.ask .n{font-family:var(--mono); font-size:clamp(13px,1.9vh,16px); font-weight:600; color:var(--ac)}
.ask h3{font-family:var(--serif); font-weight:600; font-size:clamp(15px,2.5vh,24px); margin:0 0 .5vh; line-height:1.1}
.ask p{margin:0; font-size:clamp(11.5px,1.6vh,14.5px); line-height:1.4; color:var(--ink2)}
.gets{display:flex; flex-direction:column; gap:1.2vh}
.get{display:grid; grid-template-columns:auto 1fr; gap:12px; align-items:start; font-size:clamp(11.5px,1.62vh,15px); line-height:1.4; color:var(--ink2)}
.get code{font-family:var(--mono); font-size:clamp(10px,1.4vh,12px); font-weight:600; color:var(--ac); padding-top:2px}
.get b{color:var(--ink); font-weight:600}
.no{display:grid; grid-template-columns:auto 1fr; gap:12px; align-items:start; font-size:clamp(11.5px,1.62vh,15px); line-height:1.4; color:var(--ink2)}
.no span{color:var(--cl); font-family:var(--mono)}

@media (max-width:900px){
  .hero,.split,.split.rev,.fin{grid-template-columns:1fr; gap:2.4vh}
  .side{width:100%}
  .tiers{grid-template-columns:1fr}
}
</style>

<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>

<script type="text/babel" data-presets="react">
const {useState, useEffect, useCallback, useRef} = React;

/* ======== утилиты ======== */
const SP = 0.5; // общее сжатие тайминга: слайд полностью читается за ~0,7 с
const D = d => ({'--d': Math.round(d * SP) + 'ms'});

function Counter({to, dec=0, dur=900, delay=250}){
  const [v, setV] = useState(0);
  useEffect(() => {
    if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){ setV(to); return; }
    let raf; const t0 = performance.now() + delay * SP;
    const tick = now => {
      if(now < t0){ raf = requestAnimationFrame(tick); return; }
      const p = Math.min(1, (now - t0) / dur);
      setV(to * (1 - Math.pow(1 - p, 3)));
      if(p < 1) raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [to, dur, delay]);
  return <>{v.toFixed(dec).replace('.', ',')}</>;
}

const Head = ({eyebrow, right, title, sub}) => (
  <div className="s-head">
    <div className="eyebrow rv" style={D(0)}>
      <span>{eyebrow}</span><span className="sp">{right}</span>
    </div>
    <h2 className="rv" style={D(60)}>{title}</h2>
    {sub && <p className="sub rv" style={D(140)}>{sub}</p>}
  </div>
);

const Src = ({children}) => <div className="s-foot"><div className="src rv" style={D(700)}>{children}</div></div>;

const Big = ({n, suf, pre, cap, delay=300}) => (
  <div className="big rv" style={D(delay)}>
    <div className="n">{pre}{n}{suf && <small>{suf}</small>}</div>
    <div className="cap">{cap}</div>
  </div>
);

/* ======== иконки направлений ======== */

      </g></svg>,

        <rect x="6" y="3" width="52" height="42" rx="1.5" fill="var(--acsoft)"/>

        <path d="M2 9v10c0 2.3 4.5 4.2 10 4.2s10-1.9 10-4.2V9"/>

        <path d="M24 16h9c3 0 3 12 6 12M24 40h9c3 0 3-12 6-12" strokeDasharray="3 3"/>
        <rect x="42" y="17" width="20" height="22" rx="1.5" fill="var(--acsoft)"/>
        <path d="M47 33v-7M52 33v-11M57 33v-4"/>
      </g></svg>,
  B2: <svg viewBox="0 0 64 48" fill="none"><g stroke="var(--ac)" strokeWidth="1.6">

const IDEAS = [
  {id:'A1', u:'Охрана', t:'Экосистема замены смен', p:'Закрытие смены перестаёт быть звонком и становится данными. Прототип уже есть.', m:'Pilot now'},

                <div key={i} className="rv" style={{...D(980 + i*100), width:f[1] + '%', fontSize:'clamp(10px,1.45vh,13px)', color:'var(--ink2)', paddingRight:'8px', lineHeight:1.25}}>{f[0]}</div>
              ))}
            </div>
          </div>
        </div>
      </div>
      <Src>Отраслевой бенчмарк · food cost 25–35 % · Штатно нет: кросс-объектного сравнения блюда, автовыявления аномалий, привязки отклонений к причинам, связки касса ↔ склад по смене</Src>
    </div>
  );
}

/* ======== 14 · приоритизация ======== */
function SPrio({go}){
  const X0 = 252, W = 726, WK = 9, sx = w => X0 + W * w / WK;
  const bars = [
    {id:'A1', l:'Замена смен + метрики', a:0, b:3, w:1},
    {id:'B1', l:'Staging и витрины', a:0, b:3, w:1},
    {id:'A4', l:'Топливо ГЛОНАСС', a:3, b:6, w:2},
    {id:'B3', l:'Food cost', a:3, b:6, w:2},
    {id:'A2', l:'Трекер допусков', a:6, b:9, w:3},
    {id:'A3', l:'Проформы', a:6, b:9, w:3},
    {id:'B2', l:'Предзаказ', a:6, b:9, w:3},
  ];
  const col = w => w === 1 ? 'var(--ac)' : w === 2 ? 'var(--ac2)' : 'var(--ac3)';
  return (
    <div className="slide">
      <Head eyebrow="Очерёдность" right="Разные команды, разные системы — можно параллельно"
        title="Три волны за девять недель"
        sub={<>Первыми — <b>A1 и B1</b> одновременно: ядро контура персонала и фундамент контура данных. Конфликта за ресурс нет.</>} />
      <div className="s-body">
        <div style={{width:'100%', height:'100%', display:'flex', flexDirection:'column', justifyContent:'center', gap:'2.4vh'}}>
          <svg viewBox="0 0 990 330" preserveAspectRatio="xMidYMid meet" style={{width:'100%', height:'auto', maxHeight:'62vh'}} role="img" aria-label="Диаграмма из трёх волн запуска на горизонте девяти недель">
            {[0,3,6,9].map(w => (
              <g key={w} className="rv" style={D(160 + w*30)}>
                <line x1={sx(w)} y1="26" x2={sx(w)} y2="292" stroke="var(--rule)" />
                <text className="t-mono" x={sx(w)} y="16" textAnchor="middle">{w} нед.</text>
              </g>
            ))}
            {[[0,3,'Волна 1'],[3,6,'Волна 2'],[6,9,'Волна 3']].map((v, i) => (
              <text key={i} className="t-mono rv" style={{...D(240 + i*90), fill: i === 0 ? 'var(--ac)' : 'var(--ink3)', fontWeight: i === 0 ? 600 : 400}}
                    x={(sx(v[0]) + sx(v[1])) / 2} y="312" textAnchor="middle">{v[2]}</text>
            ))}
            {bars.map((b, i) => {
              const y = 36 + i*36;
              return (
                <g key={b.id}>
                  <text className="t-code rv" style={D(300 + i*90)} x="0" y={y + 19}>{b.id}</text>
                  <text className="t-sub rv" style={D(300 + i*90)} x="40" y={y + 19}>{b.l}</text>
                  <rect className="gx" style={{...D(360 + i*90), transformOrigin:`${sx(b.a)}px 0px`}}
                        x={sx(b.a) + 3} y={y} width={sx(b.b) - sx(b.a) - 6} height="26" rx="2" fill={col(b.w)} />
                </g>
              );
            })}
          </svg>

          <div style={{display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:'clamp(10px,1.4vw,18px)'}}>
            {[
              ['штрафы заказчика за непокрытие постов', 'A1 становится безусловно первым'],
              ['аудит выявил крупные сливы топлива', 'A4 поднимается на первое место'],
              ['food cost variance регулярно выше 5 %', 'B1 и B3 приоритетнее B2'],
            ].map((t, i) => (
              <div key={i} className="rv" style={{...D(900 + i*110), border:'1px dashed var(--rule2)', background:'var(--soft)', borderRadius:'2px', padding:'clamp(10px,1.5vh,16px) 14px'}}>
                <div className="lbl" style={{color:'var(--cl)', marginBottom:'.6vh'}}>Если</div>
                <div style={{fontSize:'clamp(11px,1.55vh,14px)', lineHeight:1.35, color:'var(--ink2)'}}>
                  {t[0]} — <b style={{color:'var(--ink)'}}>{t[1]}</b>
                </div>
              </div>
            ))}
          </div>
        </div>
      </div>
      <Src>A2 и A3 расширяют готовый A1 · B2 запускается после того, как B1 даёт витрины — чтобы сразу мерить эффект предзаказа на переготовку</Src>
    </div>
  );
}

/* ======== 15 · финал ======== */

      <div className="s-body">
        <div className="fin">
          <div className="asks">
            {[
              ['01','Стартуем A1 и B1 параллельно?','Разные команды, разные системы. Через три недели — живой статус закрытия смен и пять дашбордов по продажам, себестоимости, списаниям, остаткам и ценам.'],
              ['02','Какие объекты даём под пилот?','Охрана — один объект с постами и 1–2 диспетчера. Питание — 2–3 объекта с read-only доступом. Желательно с разными версиями складской системы.'],

                  ['A1','Живой статус закрытия смен: fill rate, time-to-fill, невыходы, overtime, число ручных обзвонов — за реальный период.'],
                  ['B1','Пять дашбордов поверх реальных выгрузок с 2–3 объектов, со сверкой кассы и склада.'],

              <div className="lbl rv" style={{...D(800), color:'var(--cl)', marginBottom:'1.4vh'}}>Чего не будет</div>
              <div className="gets">
                {[
                  'Замены кассовой, складской, учётной систем или системы мониторинга.',
                  'Закупки оборудования. ДУТ для контроля сливов — отдельный этап по результатам A4.',
                  'Обещаний в процентах там, где количественный эффект по РФ не опубликован.',
                ].map((n, i) => (
                  <div className="no rv" style={D(860 + i*110)} key={i}><span>—</span><span>{n}</span></div>
                ))}
              </div>
            </div>
            <div className="hero-stats rv" style={{...D(1180), marginTop:0, borderTopColor:'var(--ac)'}}>
              <div><em>1–3</em><span>разработчика</span></div>
              <div><em>2–3</em><span>недели</span></div>

      </div>
      <Src>Каждая цифра в презентации помечена уровнем доказательности · нормативка РФ проверена на 2025–2026</Src>

/* ======== дека ======== */
function App(){
  const [i, setI] = useState(0);
  const goId = useCallback(id => {
    const map = {A1:5, A2:6, A3:7, A4:8, B1:10, B2:11, B3:12};
    if(map[id] !== undefined) setI(map[id]);
  }, []);

  const SLIDES = [
    {n:'Титул',        el:<STitle go={goId} />},
    {n:'Разрыв',       el:<SGap />},
    {n:'Доказательность', el:<STiers />},
    {n:'Карта',        el:<SMap />},
    {n:'Охрана',      el:<STiles unit="Охрана" cols={4} go={goId} title="Четыре направления" sub={<>A1 — ядро и первый приоритет: прототип уже есть. A4 независим и запускается параллельно.</>} />},
    {n:'A1',           el:<SA1 />},
    {n:'A2',           el:<SA2 />},
    {n:'A3',           el:<SA3 />},
    {n:'A4',           el:<SA4 />},
    {n:'Питание',      el:<STiles unit="Питание" cols={3} go={goId} title="Три направления" sub={<>B1 — фундамент: без него B2 и B3 не дадут аналитики. B2 требует наибольшей перестройки и идёт последним.</>} />},
    {n:'B1',           el:<SB1 />},
    {n:'B2',           el:<SB2 />},
    {n:'B3',           el:<SB3 />},
    {n:'Приоритеты',   el:<SPrio go={goId} />},
    {n:'Решение',      el:<SEnd />},
  ];
  const last = SLIDES.length - 1;
  const step = useCallback(d => setI(v => Math.min(last, Math.max(0, v + d))), [last]);

  useEffect(() => {
    const onKey = e => {
      if(e.metaKey || e.ctrlKey || e.altKey) return;
      const k = e.key;
      if(k === 'ArrowRight' || k === 'ArrowDown' || k === 'PageDown' || k === ' '){ e.preventDefault(); step(1); }
      else if(k === 'ArrowLeft' || k === 'ArrowUp' || k === 'PageUp'){ e.preventDefault(); step(-1); }
      else if(k === 'Home'){ e.preventDefault(); setI(0); }
      else if(k === 'End'){ e.preventDefault(); setI(last); }
      else if(k === 'f' || k === 'F' || k === 'а' || k === 'А'){
        document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
      }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [step, last]);

  return (
    <div className="stage">
      <div key={i} style={{flex:1, minHeight:0, display:'flex'}}>{SLIDES[i].el}</div>
      <div className="bar">
        <div className="brand">Охрана · Питание</div>
        <div className="ticks">
          {SLIDES.map((s, k) => (
            <button className="tick" key={k} data-on={k === i ? '1' : '0'} onClick={() => setI(k)} title={s.n} aria-label={s.n}><i /></button>
          ))}
        </div>
        <div className="count"><b>{String(i+1).padStart(2,'0')}</b> / {SLIDES.length}</div>
        <div className="btns">
          <button onClick={() => step(-1)} disabled={i === 0} aria-label="Назад">←</button>
          <button onClick={() => step(1)} disabled={i === last} aria-label="Вперёд">→</button>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
