<title>Семь направлений автоматизации</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap">

<style>
:root{
  --white:#FFFFFF;
  --soft:#F4F7F7;
  --soft2:#EAF0F0;
  --ink:#0C1416;
  --ink2:#4C5F63;
  --ink3:#6E8085;
  --rule:#E1E8E9;
  --rule2:#C0CDCE;
  --ac:#0E5461;
  --ac2:#13899B;
  --ac3:#A9D4DA;
  --acsoft:#E7F2F4;
  --am:#9C6F14;
  --amsoft:#FAF2E0;
  --cl:#A04A2F;
  --clsoft:#FBEDE8;
  --f:"Golos Text","Helvetica Neue",Arial,sans-serif;

  --fs-min:14px;
  --fs-body:clamp(15px,1.85vh,19px);
  --fs-lede:clamp(16px,2.15vh,22px);
  --fs-h3:clamp(18px,2.5vh,27px);
  --fs-h2:clamp(26px,4.2vh,46px);
  --fs-h1:clamp(34px,6.9vh,74px);
}
*{box-sizing:border-box}
html,body{height:100%; margin:0; overflow:hidden; background:var(--white)}
body{font-family:var(--f); color:var(--ink); font-size:16px; -webkit-font-smoothing:antialiased}
#root{height:100%}

/* ---------- каркас ---------- */
.stage{position:fixed; inset:0; display:flex; flex-direction:column; background:var(--white)}
.slide{flex:1; min-height:0; display:flex; flex-direction:column; padding:4vh clamp(24px,4.2vw,72px) 1.8vh; position:relative}
.s-head{flex:none}
.s-body{flex:1; min-height:0; display:flex; align-items:center; justify-content:center; padding:2.4vh 0}
.s-foot{flex:none; min-height:2vh}

.eyebrow{
  font-size:var(--fs-min); font-weight:500; letter-spacing:.04em;
  color:var(--ink3); display:flex; gap:16px; align-items:baseline; margin-bottom:1.4vh;
}
.eyebrow b{color:var(--ac); font-weight:600}
.eyebrow .sp{margin-left:auto}
h1{font-weight:700; font-size:var(--fs-h1); line-height:1.02; letter-spacing:-.028em; margin:0; text-wrap:balance}
h2{font-weight:700; font-size:var(--fs-h2); line-height:1.08; letter-spacing:-.022em; margin:0; text-wrap:balance}
h3{font-weight:600; font-size:var(--fs-h3); line-height:1.16; letter-spacing:-.012em; margin:0}
.sub{font-size:var(--fs-lede); font-weight:400; line-height:1.44; color:var(--ink2); margin:1.2vh 0 0; max-width:78ch}
.sub b{color:var(--ink); font-weight:600}
.src{font-size:var(--fs-min); font-weight:400; color:var(--ink3); line-height:1.4}

/* ---------- анимации ---------- */
@keyframes rv{from{opacity:0; transform:translateY(16px)} to{opacity:1; transform:none}}
@keyframes pop{from{opacity:0; transform:scale(.88)} to{opacity:1; transform:none}}
@keyframes grow{from{transform:scaleX(0)} to{transform:scaleX(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
.rv{opacity:0; animation:rv .5s cubic-bezier(.2,.75,.3,1) forwards; animation-delay:var(--d,0ms)}
.pop{opacity:0; animation:pop .45s cubic-bezier(.2,.9,.3,1) forwards; animation-delay:var(--d,0ms)}
.gx{transform:scaleX(0); transform-origin:left; animation:grow .8s cubic-bezier(.25,.8,.3,1) forwards; animation-delay:var(--d,0ms)}
.dw{stroke-dasharray:900; stroke-dashoffset:900; animation:draw .9s ease forwards; animation-delay:var(--d,0ms)}
@media (prefers-reduced-motion:reduce){
  .rv,.pop{opacity:1; animation:none; transform:none}
  .gx{transform:none; animation:none}
  .dw{stroke-dashoffset:0; animation:none}
}

/* ---------- нижняя навигация ---------- */
.bar{
  flex:none; height:60px; border-top:1px solid var(--rule); background:var(--white);
  display:flex; align-items:center; gap:18px; padding:0 clamp(18px,3vw,40px);
}
.allbtn{
  font-family:var(--f); font-size:var(--fs-min); font-weight:600; letter-spacing:.01em;
  border:1px solid var(--ac); background:var(--acsoft); color:var(--ac);
  border-radius:3px; padding:8px 16px; cursor:pointer; white-space:nowrap;
  transition:background .16s, color .16s;
}
.allbtn:hover{background:var(--ac); color:var(--white)}
.allbtn[data-here="1"]{opacity:.4; pointer-events:none}
.ticks{display:flex; gap:4px; flex:1; align-items:center}
.tick{height:24px; flex:1; max-width:52px; border:0; background:none; cursor:pointer; padding:0; display:flex; align-items:center}
.tick i{display:block; width:100%; height:2px; background:var(--rule2); transition:background .2s, height .2s}
.tick:hover i{background:var(--ac2)}
.tick[data-on="1"] i{background:var(--ac); height:4px}
.count{font-size:var(--fs-min); font-weight:500; color:var(--ink2); font-variant-numeric:tabular-nums}
.count b{color:var(--ac); font-weight:700}
.btns{display:flex; gap:6px}
.btns button{
  width:36px; height:36px; border:1px solid var(--rule2); background:var(--white); color:var(--ink2);
  border-radius:3px; cursor:pointer; font-family:var(--f); font-size:16px; line-height:1;
  display:flex; align-items:center; justify-content:center;
}
.btns button:hover:not(:disabled){border-color:var(--ac); color:var(--ac)}
.btns button:disabled{opacity:.3; cursor:default}
:focus-visible{outline:2px solid var(--ac); outline-offset:2px}

/* ---------- общие элементы ---------- */
.chip{
  display:inline-flex; align-items:center; font-size:var(--fs-min); font-weight:500;
  border:1px solid; border-radius:3px; padding:5px 11px; white-space:nowrap; line-height:1.2;
}
.chip[data-t="v"]{color:var(--ac); border-color:var(--ac3); background:var(--acsoft)}
.chip[data-t="w"]{color:var(--am); border-color:var(--am); background:var(--amsoft)}
.chip[data-t="m"]{color:var(--ink2); border-color:var(--rule2); background:var(--soft)}
.chip[data-t="f"]{color:var(--cl); border-color:var(--cl); background:var(--clsoft)}

.lbl{font-size:var(--fs-min); font-weight:600; letter-spacing:.03em; color:var(--ink3)}
.lbl.ac{color:var(--ac)}

svg.viz{width:100%; height:100%; max-height:100%; display:block}
svg text{font-family:var(--f)}
.t-lbl{fill:var(--ink); font-size:19px; font-weight:600}
.t-sub{fill:var(--ink2); font-size:17px; font-weight:400}
.t-code{fill:var(--ac); font-size:19px; font-weight:700}
.t-ax{fill:var(--ink3); font-size:17px; font-weight:500}

/* ---------- титул ---------- */
.hero{display:grid; grid-template-columns:1.12fr .88fr; gap:clamp(24px,4vw,64px); align-items:center; width:100%}
.hero-stats{display:flex; gap:clamp(20px,3vw,48px); margin-top:3.4vh; padding-top:2vh; border-top:2px solid var(--ink)}
.hero-stats div{display:flex; flex-direction:column; gap:4px}
.hero-stats em{font-style:normal; font-weight:700; font-size:clamp(22px,3.8vh,38px); color:var(--ac); line-height:1}
.hero-stats span{font-size:var(--fs-min); font-weight:500; color:var(--ink3)}
.board{border:1px solid var(--rule); background:var(--white); box-shadow:0 22px 54px -36px rgba(12,20,22,.5)}
.board-h{font-size:var(--fs-min); font-weight:600; letter-spacing:.03em; color:var(--ink3); padding:1.4vh 16px; border-bottom:1px solid var(--rule)}
.board-s{padding:1.4vh 14px}
.board-s+.board-s{border-top:1px solid var(--rule)}
.board-l{font-size:var(--fs-min); font-weight:600; color:var(--ac); margin-bottom:1vh}
.cellrow{display:grid; gap:6px}
.cell{
  display:flex; align-items:baseline; gap:12px; text-align:left; width:100%;
  border:1px solid var(--rule); background:var(--soft); padding:1.05vh 12px; cursor:pointer; border-radius:3px;
  font-family:var(--f); font-size:var(--fs-min); font-weight:500; color:var(--ink2); line-height:1.3;
  transition:border-color .16s, background .16s, color .16s, transform .16s;
}
.cell code{font-family:var(--f); font-size:var(--fs-min); font-weight:700; color:var(--ac); flex:none}
.cell:hover{border-color:var(--ac); background:var(--acsoft); color:var(--ink); transform:translateX(3px)}

/* ---------- плитки ---------- */
.tiles{display:grid; gap:clamp(12px,1.5vw,20px); width:100%}
.tile{
  border:1px solid var(--rule); background:var(--white); border-radius:3px; cursor:pointer;
  padding:clamp(16px,2.6vh,28px); display:flex; flex-direction:column; gap:1.4vh; text-align:left;
  transition:border-color .18s, box-shadow .18s, transform .18s; min-height:0;
}
.tile:hover{border-color:var(--ac); box-shadow:0 18px 36px -28px rgba(12,20,22,.55); transform:translateY(-3px)}
.tile .ico{flex:none; height:clamp(40px,6.4vh,60px)}
.tile .ico svg{height:100%; width:auto; display:block}
.tile .code{font-size:var(--fs-min); font-weight:700; color:var(--ac); letter-spacing:.05em}
.tile p{margin:0; font-size:var(--fs-body); line-height:1.44; color:var(--ink2); flex:1; min-height:0}

/* ---------- разрыв ---------- */
.gaprow{display:grid; grid-template-columns:clamp(180px,20vw,290px) 1fr; gap:clamp(16px,2.2vw,32px); align-items:center}
.gapname{font-weight:700; font-size:var(--fs-h3); line-height:1.12; text-align:right}
.gapbar{display:flex; height:clamp(52px,8.4vh,86px); border:1px solid var(--rule); border-radius:3px; overflow:hidden}
.gapseen{flex:none; background:var(--ac); display:flex; align-items:center; padding:0 clamp(12px,1.4vw,20px)}
.gapseen span{color:var(--white); font-size:var(--fs-min); font-weight:600; line-height:1.3}
.gapblind{
  flex:1; display:flex; align-items:center; padding:0 clamp(14px,1.6vw,24px); background:var(--soft);
  background-image:repeating-linear-gradient(-45deg,transparent 0 7px,rgba(12,20,22,.08) 7px 8px);
}
.gapblind span{font-size:var(--fs-body); font-weight:500; color:var(--ink2); line-height:1.34}

/* ---------- шаги / списки ---------- */
.steps{display:flex; flex-direction:column; gap:1.8vh; margin:0; padding:0; list-style:none}
.step{display:grid; grid-template-columns:34px 1fr; gap:16px; align-items:baseline}
.step .n{font-size:var(--fs-body); font-weight:700; color:var(--ac); font-variant-numeric:tabular-nums}
.step p{margin:0; font-size:var(--fs-body); line-height:1.44; color:var(--ink2)}
.step p b{color:var(--ink); font-weight:600}

.causes{display:grid; grid-template-columns:repeat(4,1fr); gap:clamp(10px,1.3vw,18px); width:100%}
.cause{border:1px solid var(--rule); border-top:3px solid var(--ac); border-radius:3px; padding:clamp(14px,2vh,20px); background:var(--white)}
.cause .h{font-size:var(--fs-h3); font-weight:600; line-height:1.14; margin-bottom:.9vh}
.cause p{margin:0; font-size:var(--fs-min); line-height:1.4; color:var(--ink2)}

.metrics{display:flex; flex-wrap:wrap; gap:9px}

/* ---------- финал ---------- */
.nda{
  border:1px solid var(--ac); background:var(--acsoft); border-radius:3px;
  padding:clamp(16px,2.4vh,26px) clamp(18px,2vw,30px); display:flex; gap:clamp(18px,2.4vw,36px);
  align-items:center; flex-wrap:wrap;
}
.nda .big{font-size:var(--fs-h3); font-weight:700; line-height:1.2; color:var(--ink); flex:1; min-width:280px}
.nda p{margin:0; font-size:var(--fs-body); line-height:1.42; color:var(--ink2); flex:1; min-width:260px}
.finsteps{display:grid; grid-template-columns:repeat(5,1fr); gap:clamp(10px,1.3vw,18px)}
.fs{display:flex; flex-direction:column; gap:.9vh; border-top:2px solid var(--rule2); padding-top:1.4vh}
.fs[data-hot="1"]{border-top-color:var(--ac)}
.fs .n{font-size:var(--fs-body); font-weight:700; color:var(--ac); font-variant-numeric:tabular-nums}
.fs .t{font-size:var(--fs-h3); font-weight:600; line-height:1.14}
.fs .w{font-size:var(--fs-min); font-weight:500; color:var(--ink3)}
.fs p{margin:0; font-size:var(--fs-min); line-height:1.42; color:var(--ink2)}

@media (max-width:960px){
  .hero,.causes,.finsteps{grid-template-columns:1fr}
  .split{grid-template-columns:1fr}
  .gaprow{grid-template-columns:1fr; gap:8px}
  .gapname{text-align:left}
}
.split{display:grid; grid-template-columns:1fr clamp(230px,24vw,340px); gap:clamp(22px,3.4vw,54px); width:100%; height:100%; align-items:center}
.vizbox{min-width:0; min-height:0; height:100%; display:flex; align-items:center}
.side{display:flex; flex-direction:column; gap:2.2vh}
</style>

<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>

<script type="text/babel" data-presets="react">

const Head = ({eyebrow, right, title, sub}) => (
  <div className="s-head">
    {(eyebrow || right) && (
      <div className="eyebrow rv" style={D(0)}>
        <span>{eyebrow}</span><span className="sp">{right}</span>

const Src = ({children}) => <div className="s-foot"><div className="src rv" style={D(640)}>{children}</div></div>;

/* ======== 01 · титул ======== */
function STitle({go}){
  return (
    <div className="slide">
      <div className="s-head">

/* ======== 02 · разрыв ======== */

/* ======== дека ======== */
function App(){
  const [i, setI] = useState(0);
  const MAP = {A1:4, A2:5, A3:6, A4:7, B1:9, B2:10, B3:11};
  const goId = useCallback(id => { if(MAP[id] !== undefined) setI(MAP[id]); }, []);

  const SLIDES = [
    {n:'Титул',           el:<STitle go={goId} />},
    {n:'Постановка',      el:<SGap />},
    {n:'Карта',           el:<SMap />},
    {n:'МегаЩит',         el:<STiles unit="МегаЩит" cols={4} go={goId} title="МегаЩит: четыре инициативы" />},
    {n:'A1',              el:<SA1 />},
    {n:'A2',              el:<SA2 />},
    {n:'A3',              el:<SA3 />},
    {n:'A4',              el:<SA4 />},
    {n:'СН-Торг',         el:<STiles unit="СН-Торг" cols={3} go={goId} title="СН-Торг: три инициативы" />},
    {n:'B1',              el:<SB1 />},
    {n:'B2',              el:<SB2 />},
    {n:'B3',              el:<SB3 />},
    {n:'Дорожная карта',  el:<SRoad />},
    {n:'Следующие шаги',  el:<SEnd />},
  ];
  const last = SLIDES.length - 1;
  const step = useCallback(d => setI(v => Math.min(last, Math.max(0, v + d))), [last]);

  useEffect(() => {
    const onKey = e => {
      if(e.metaKey || e.ctrlKey || e.altKey) return;
      const k = e.key;
      if(k === 'ArrowRight' || k === 'ArrowDown' || k === 'PageDown' || k === ' '){ e.preventDefault(); step(1); }
      else if(k === 'ArrowLeft' || k === 'ArrowUp' || k === 'PageUp'){ e.preventDefault(); step(-1); }
      else if(k === 'Home'){ e.preventDefault(); setI(0); }
      else if(k === 'End'){ e.preventDefault(); setI(last); }
      else if(k === 'f' || k === 'F' || k === 'а' || k === 'А'){
        document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
      }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [step, last]);

  return (
    <div className="stage">
      <div key={i} style={{flex:1, minHeight:0, display:'flex'}}>{SLIDES[i].el}</div>
      <div className="bar">
        <button className="allbtn" data-here={i === 0 ? '1' : '0'} onClick={() => setI(0)}>Все идеи</button>
        <div className="ticks">
          {SLIDES.map((s, k) => (
            <button className="tick" key={k} data-on={k === i ? '1' : '0'} onClick={() => setI(k)} title={s.n} aria-label={s.n}><i /></button>
          ))}
        </div>
        <div className="count"><b>{String(i+1).padStart(2,'0')}</b> / {SLIDES.length}</div>
        <div className="btns">
          <button onClick={() => step(-1)} disabled={i === 0} aria-label="Предыдущий слайд">←</button>
          <button onClick={() => step(1)} disabled={i === last} aria-label="Следующий слайд">→</button>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
